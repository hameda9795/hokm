name: Deploy to Hetzner

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment variables
        run: |
          echo "DEPLOYMENT_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Deploy to Hetzner Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Navigate to project directory
            cd /opt/hokm
            
            # Pull latest changes
            echo "📥 Pulling latest changes..."
            git pull origin main
            
            # Create/Update .env file
            echo "📝 Updating .env file..."
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
            echo "TELEGRAM_WEBHOOK_DOMAIN=https://hokm.maxhmd.dev" >> .env
            echo "NODE_ENV=production" >> .env
            echo "ADMIN_TELEGRAM_ID=${{ secrets.ADMIN_TELEGRAM_ID }}" >> .env
            echo "ADMIN_TELEGRAM_USERNAME=${{ secrets.ADMIN_TELEGRAM_USERNAME }}" >> .env
            
            # Build and restart containers
            echo "🏗️  Building Docker containers..."
            docker compose build --no-cache
            
            echo "🔄 Restarting services..."
            docker compose down
            docker compose up -d
            
            # Health check
            echo "🏥 Waiting for services to start..."
            sleep 10
            
            # Check if services are running
            if docker compose ps | grep -q "Up"; then
              echo "✅ Services are running"
            else
              echo "❌ Services failed to start"
              docker compose logs --tail=50
              exit 1
            fi

            # Update Nginx Configuration
            echo "🔧 Updating Nginx configuration..."
            cp nginx-system-config.conf /etc/nginx/sites-available/hokm.conf
            ln -sf /etc/nginx/sites-available/hokm.conf /etc/nginx/sites-enabled/
            
            # Test and Reload Nginx
            if nginx -t; then
              echo "✅ Nginx configuration valid"
              systemctl reload nginx
              echo "🔄 Nginx reloaded"
            else
              echo "❌ Invalid Nginx configuration"
              exit 1
            fi

            echo "✅ Deployment successful!"
            echo "📦 Commit: ${GITHUB_SHA:0:7}"
            # Cleanup old images
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f

      - name: Send deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment completed successfully"
          else
            echo "❌ Deployment failed"
          fi

      - name: Notify via Telegram (Optional)
        if: success()
        run: |
          if [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            COMMIT_SHORT="${GITHUB_SHA:0:7}"
            CURRENT_TIME=$(date +'%Y-%m-%d %H:%M:%S')
            curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="🚀 Hokm Game deployed successfully!%0ACommit: ${COMMIT_SHORT}%0ATime: ${CURRENT_TIME}"
          fi
